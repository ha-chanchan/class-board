<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いま、なんのじかん？</title><style>
:root{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;color:#16324f;background:#e9f3ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:#dcecff;color:#16324f;font-weight:800}button.primary{background:#2365c7;color:white}button.active{background:#ffca65}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 25px}header .clock{font-size:clamp(25px,3.8vw,58px);font-weight:900;font-variant-numeric:tabular-nums}.date{font-size:clamp(15px,1.6vw,26px);font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.layout{padding:0 25px 20px;max-width:1800px;margin:auto}.hero{background:white;border-radius:28px;min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:0 12px 35px #2e5b9d18}.eyebrow{font-size:clamp(22px,3vw,44px);color:#5c7897;font-weight:900}.period{font-size:clamp(35px,5vw,78px);font-weight:900;color:#2766c6;margin-top:12px}.subject{font-size:clamp(65px,11vw,180px);font-weight:900;line-height:1.25;overflow-wrap:anywhere}.note{font-size:clamp(20px,2.7vw,43px);font-weight:700;color:#56718d;min-height:1.4em}.bottom{display:grid;grid-template-columns:2fr 1fr;gap:15px;margin-top:16px}.panel{background:white;border-radius:22px;padding:22px 26px}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.label{font-size:clamp(17px,2vw,30px);font-weight:800}.remaining{font-size:clamp(25px,3vw,48px);font-weight:900;color:#2465c7}.track{height:22px;background:#dbe9fa;border-radius:30px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#3678dc;width:0%;transition:width .4s}.next{font-size:clamp(21px,2.6vw,42px);font-weight:900;margin-top:12px}dialog{border:0;border-radius:20px;width:min(920px,95vw);max-height:90vh;box-shadow:0 20px 90px #183c6a55;padding:24px}dialog::backdrop{background:#12243a99}.settingsTop{display:flex;justify-content:space-between;align-items:center}.settingsTop h2{margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.grid input,.grid select{width:100%;min-width:0;padding:10px;border:1px solid #c6d6e6;border-radius:9px}.rowlabel{font-weight:800;font-size:14px}.editrow{border-bottom:1px solid #e3ebf4;padding:10px 0}.editrow .grid{margin:5px 0}.hint{color:#60768b;font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.manual{background:#fff3d4;border-radius:14px;padding:12px;margin-top:12px}.hidden{display:none!important}@media(max-width:700px){header{padding:12px;flex-wrap:wrap}.layout{padding:0 12px 12px}.hero{min-height:52vh}.bottom{grid-template-columns:1fr}.panel{padding:17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1000px){.teacher-only{opacity:.35}.teacher-only:hover{opacity:1}}body.fullscreen .teacher-only{display:none}body.fullscreen header{justify-content:space-between}

/* 教科ごとのやさしい配色 */
:root{--subject-accent:#2766c6;--subject-soft:#e9f3ff;--subject-ink:#16324f}
body{background:var(--subject-soft);transition:background .5s}
.hero{border:8px solid var(--subject-accent);background:linear-gradient(160deg,#fff 62%,var(--subject-soft));transition:border-color .5s,background .5s}
.period,.remaining{color:var(--subject-accent)}.fill{background:var(--subject-accent)}
.subject{color:var(--subject-ink)}.subject-art{font-size:clamp(72px,10vw,150px);line-height:1.1;margin-bottom:5px;filter:drop-shadow(0 7px 5px #00000012)}
.hero .subject{font-size:clamp(55px,9vw,150px)}
@media(max-height:850px){.hero{min-height:49vh}.subject-art{font-size:clamp(58px,8vh,110px)}.hero .subject{font-size:clamp(52px,8vh,110px)}}
</style></head><body><header><div><div class="date" id="date"></div><div class="clock" id="clock"></div></div><div class="actions teacher-only"><button id="autoBtn" class="primary">自動モード</button><button id="prevBtn">◀ 前へ</button><button id="nextBtn">次へ ▶</button><button id="settingsBtn">⚙ 設定</button><button id="fullBtn">⛶ 全画面</button></div></header><main class="layout"><section class="hero"><div class="eyebrow" id="eyebrow">いまは</div><div class="period" id="period"></div><div class="subject-art" id="subjectArt" aria-hidden="true">🎒</div><div class="subject" id="subject">じゅんびちゅう</div><div class="note" id="note"></div></section><section class="bottom"><div class="panel"><div class="line"><div class="label" id="remainingLabel">のこり時間</div><div class="remaining" id="remaining">--</div></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="panel"><div class="label">つぎは</div><div class="next" id="nextSubject">--</div><div id="nextTime"></div></div></section></main><dialog id="settings"><div class="settingsTop"><h2>⚙ じかんわりの設定</h2><button id="closeSettings">閉じる ✕</button></div><p class="hint">曜日ごとに編集できます。保存すると、このブラウザに記録されます。</p><label>編集する曜日 <select id="daySelect"></select></label><div id="editor"></div><div class="controls"><button id="addRow">＋ 時間を追加</button><button class="primary" id="save">保存する</button><button id="reset">初期設定にもどす</button></div><div class="manual"><b>手動モード</b><p class="hint">画面上の「前へ」「次へ」で表示を変えられます。「自動モード」で現在の時間割に戻ります。</p><label>表示する曜日 <select id="displayDay"></select></label></div></dialog><script>
const DAYS=['日','月','火','水','木','金','土'];const names=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
const subjects={1:['こくご','さんすう','たいいく','こくご','せいかつ'],2:['ずこう','ずこう','おんがく','さんすう','こくご'],3:['さんすう','たいいく','こくご','しょしゃ','せいかつ'],4:['さんすう','こくご','どうとく','せいかつ','たいいく'],5:['こくご','さんすう','おんがく','こくご','がっかつ']};
const mornings={1:'あさどくしょ・よみきかせ',2:'あさせいそう',3:'ちょうかい',4:'あさせいそう',5:'あさせいそう'};
const fresh=()=>Object.fromEntries([1,2,3,4,5].map(d=>{let lessons=subjects[d],a=[['08:00','08:25','じゅんびちゅう','あさのじゅんび'],['08:25','08:40',mornings[d],'あさのかつどう'],['08:40','08:50','あさのかい','あさのかい']];const add=(start,end,subject,period)=>a.push([start,end,subject,period]);[['08:50','09:35'],['09:45','10:30'],['10:50','11:35'],['11:45','12:30'],['13:35','14:20']].forEach(([start,end],i)=>{if(i===2)add('10:30','10:50','ぎょうかんやすみ','やすみじかん');if(i===4){add('12:30','13:05','きゅうしょく','きゅうしょく');add('13:05','13:15','はみがき','はみがき');add('13:15','13:35','ひるやすみ','やすみじかん')}add(start,end,lessons[i],`${i+1}じかんめ`)});add('14:20','14:30','かえりのかい','かえりのかい');return [d,a.map(x=>({start:x[0],end:x[1],subject:x[2],period:x[3],note:''}))]}));
let schedule;try{schedule=JSON.parse(localStorage.getItem('classboard-schedule-v3'))||JSON.parse(localStorage.getItem('classboard-schedule-v2'))||fresh()}catch{schedule=fresh()}for(const d of [1,2,3,4,5]){if(Array.isArray(schedule[d])&&!schedule[d].some(x=>x.start==='08:00'))schedule[d].unshift({start:'08:00',end:'08:25',subject:'じゅんびちゅう',period:'あさのじゅんび',note:''})}const morningMessage='しゅくだいを だして、じゅんびを おわらせよう！';
const breakMessage='つぎの じゅぎょうの きょうかしょを だそう！';
for(const d of [1,2,3,4,5]){for(const item of (schedule[d]||[])){
 if(item.start==='08:00'&&item.end==='08:25'&&!item.note)item.note=morningMessage;
 if((item.period==='やすみじかん'||item.subject==='ぎょうかんやすみ'||item.subject==='ひるやすみ')&&!item.note)item.note=breakMessage;
}}
const palettes={
'こくご':['#d85b70','#fff0f2','📖'],'さんすう':['#2875d4','#e8f2ff','🔢'],'たいいく':['#28945e','#e5f7e9','⚽'],'おんがく':['#8755c5','#f2eaff','🎵'],'ずこう':['#df8730','#fff2df','🎨'],'せいかつ':['#289d87','#e4f7f0','🌱'],'どうとく':['#bc6b9d','#fcecf5','💗'],'しょしゃ':['#64748b','#edf2f7','🖌️'],'がっかつ':['#e5a225','#fff5d9','🤝'],
'じゅんびちゅう':['#e18a36','#fff3df','🎒'],'ぎょうかんやすみ':['#36a4a0','#e5f9f6','📚'],'ひるやすみ':['#36a4a0','#e5f9f6','📚'],'きゅうしょく':['#e49b37','#fff3df','🍚'],'はみがき':['#379cc9','#e7f7ff','🪥'],'あさのかい':['#5d9a65','#e9f6e9','☀️'],'かえりのかい':['#7185c1','#edf0ff','🏠'],'あさせいそう':['#5b9e8e','#e7f6ef','🧹'],'ちょうかい':['#7185c1','#edf0ff','🏫'],'あさどくしょ・よみきかせ':['#c17d52','#fff0e5','📚']};
function themeFor(item){let key=item?.subject||'';let t=palettes[key]||(item?.period==='やすみじかん'?palettes['ひるやすみ']:['#467bb5','#e9f3ff','✨']);document.documentElement.style.setProperty('--subject-accent',t[0]);document.documentElement.style.setProperty('--subject-soft',t[1]);$('subjectArt').textContent=t[2]}
let mode='auto' ,manualIndex=0,overrideDay=null;const $=id=>document.getElementById(id);function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}function rows(day){return (schedule[day]||[]).slice().sort((a,b)=>minutes(a.start)-minutes(b.start))}function dayNow(){return overrideDay===null?new Date().getDay():overrideDay}function locate(day,now){let r=rows(day),i=r.findIndex(x=>now>=minutes(x.start)&&now<minutes(x.end));return {r,i}}function render(){let n=new Date(),day=dayNow(),now=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;const fmt=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'});$('date').textContent=fmt.format(n);$('clock').textContent=n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});let {r,i}=locate(day,now);if(mode==='manual'){i=Math.max(0,Math.min(manualIndex,r.length-1))}let item=i>=0?r[i]:null;let next=i>=0?r[i+1]:r.find(x=>minutes(x.start)>now);if(mode==='manual'&&!r.length)item=null;if(!item){$('period').textContent='';$('subject').textContent=next?'つぎのじかんを まとう':'きょうも おつかれさま！';$('note').textContent=next?'じゅんびを しよう':''}else{$('period').textContent=item.period||'';$('subject').textContent=item.subject||'じゆう';$('note').textContent=item.note||''}themeFor(item);$('nextSubject').textContent=next?.subject||'おしまい';$('nextTime').textContent=next?`${next.start} 〜 ${next.end}`:'';let remain=item?Math.max(0,Math.ceil(minutes(item.end)-now)):next?Math.max(0,Math.ceil(minutes(next.start)-now)):0;$('remainingLabel').textContent=item?'のこり時間':'つぎまで';$('remaining').textContent=item||next?`${remain}ぷん`:'--';let fraction=item?(now-minutes(item.start))/Math.max(1,minutes(item.end)-minutes(item.start)):0;$('fill').style.width=`${Math.max(0,Math.min(100,fraction*100))}%`;$('autoBtn').textContent=mode==='auto'?'● 自動モード':'↻ 自動に戻す';$('autoBtn').classList.toggle('active',mode==='manual')}
function edit(){let d=Number($('daySelect').value);$('editor').innerHTML='';rows(d).forEach((r,i)=>{let div=document.createElement('div');div.className='editrow';div.innerHTML=`<div class="rowlabel">${i+1}つめ</div><div class="grid"><label>はじまり<input type="time" data-field="start" value="${esc(r.start)}"></label><label>おわり<input type="time" data-field="end" value="${esc(r.end)}"></label><label>時間の名前<input data-field="period" value="${esc(r.period)}"></label><label>教科・活動<input data-field="subject" value="${esc(r.subject)}"></label></div><div class="grid" style="grid-template-columns:1fr auto"><label>ひとこと<input data-field="note" value="${esc(r.note||'')}"></label><button data-remove="${i}">削除</button></div>`;$('editor').appendChild(div)});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{collect();schedule[d].splice(Number(b.dataset.remove),1);edit()})}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function collect(){let d=Number($('daySelect').value);schedule[d]=[...$('editor').querySelectorAll('.editrow')].map(el=>Object.fromEntries([...el.querySelectorAll('[data-field]')].map(input=>[input.dataset.field,input.value])))}for(let d=0;d<7;d++){for(let id of ['daySelect','displayDay']){let opt=document.createElement('option');opt.value=d;opt.textContent=names[d];$(id).append(opt)}}$('daySelect').value=new Date().getDay()||1;$('displayDay').value=new Date().getDay();$('daySelect').onchange=edit;$('displayDay').onchange=()=>{overrideDay=Number($('displayDay').value);mode='manual';manualIndex=0;render()};$('settingsBtn').onclick=()=>{$('settings').showModal();edit()};$('closeSettings').onclick=()=>$('settings').close();$('addRow').onclick=()=>{collect();let d=Number($('daySelect').value);(schedule[d]??=[]).push({start:'14:40',end:'15:00',period:'',subject:'あたらしい時間',note:''});edit()};$('save').onclick=()=>{collect();for(let d in schedule){for(let x of schedule[d])if(minutes(x.end)<=minutes(x.start)){alert('終了時刻は開始時刻より後にしてください');return}}localStorage.setItem('classboard-schedule-v3',JSON.stringify(schedule));$('settings').close();render()};$('reset').onclick=()=>{if(confirm('すべての曜日の時間割を初期設定に戻しますか？')){schedule=fresh();localStorage.setItem('classboard-schedule-v3',JSON.stringify(schedule));edit();render()}};$('autoBtn').onclick=()=>{mode='auto';overrideDay=null;render()};function shift(k){let d=dayNow(),now=new Date(),{r,i}=locate(d,now.getHours()*60+now.getMinutes());if(mode==='auto')manualIndex=i>=0?i:Math.max(0,r.findIndex(x=>minutes(x.start)>now.getHours()*60+now.getMinutes()));manualIndex=Math.max(0,Math.min(r.length-1,manualIndex+k));mode='manual';render()}$('prevBtn').onclick=()=>shift(-1);$('nextBtn').onclick=()=>shift(1);$('fullBtn').onclick=async()=>{if(document.fullscreenElement){await document.exitFullscreen()}else{try{await document.documentElement.requestFullscreen()}catch{document.body.classList.toggle('fullscreen')}}};document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));render();setInterval(render,1000);
</script></body></html>
