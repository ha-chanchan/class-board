</style></head><body><header><div class="brand-stack"><div class="brand"><span class="brand-mark">✦</span><span>CLASSROOM <b>BOARD</b></span><span class="brand-pill">2年生</span></div><div class="date" id="date"></div></div><div class="clock-wrap"><div class="clock-label">いまのじこく</div><div class="clock" id="clock"></div></div><div class="actions teacher-only"><button id="autoBtn" class="primary">自動モード</button><button id="prevBtn">◀ 前へ</button><button id="nextBtn">次へ ▶</button><button id="todayBtn">✏️ きょうだけ変更</button><button id="settingsBtn">⚙ 設定</button><button id="fullBtn">⛶ 全画面</button></div></header><main class="layout"><section class="hero"><div class="hero-decoration"></div><div class="eyebrow" id="eyebrow">いまは</div><div class="period" id="period"></div><div class="subject-art" id="subjectArt" aria-hidden="true">🎒</div><div class="subject" id="subject">じゅんびちゅう</div><div class="note" id="note"></div></section><section class="bottom"><div class="panel progress-panel"><div class="line"><div class="label" id="remainingLabel">のこり時間</div><div class="remaining" id="remaining">--</div></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="panel next-panel"><div class="label">NEXT / つぎは</div><div class="next" id="nextSubject">--</div><div id="nextTime"></div></div></section></main><dialog id="todayDialog"><div class="settingsTop"><h2>✏️ きょうだけ じかんわり変更</h2><button id="closeToday">閉じる ✕</button></div><p class="hint">今日の1〜5じかんめを、それぞれ変更できます。時間は変わりません。明日になると自動で通常の時間割に戻ります。</p><div class="today-head"><b id="todayDate"></b><span class="today-tag">きょうだけ</span></div><div id="todayEditor" class="today-editor"></div><div class="controls"><button class="primary" id="saveToday">きょうの変更を保存</button><button id="resetToday">きょうの変更を全部もどす</button></div><p class="today-info">※この電子黒板のブラウザに保存されます。曜日ごとの基本時間割は変更されません。</p></dialog><dialog id="settings"><div class="settingsTop"><h2>⚙ じかんわりの設定</h2><button id="closeSettings">閉じる ✕</button></div><p class="hint">曜日ごとに編集できます。保存すると、このブラウザに記録されます。</p><label>編集する曜日 <select id="daySelect"></select></label><div id="editor"></div><div class="controls"><button id="addRow">＋ 時間を追加</button><button class="primary" id="save">保存する</button><button id="reset">初期設定にもどす</button></div><div class="manual"><b>手動モード</b><p class="hint">画面上の「前へ」「次へ」で表示を変えられます。「自動モード」で現在の時間割に戻ります。</p><label>表示する曜日 <select id="displayDay"></select></label></div></dialog><script>
const DAYS=['日','月','火','水','木','金','土'];const names=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
const subjects={1:['こくご','さんすう','たいいく','こくご','せいかつ'],2:['ずこう','ずこう','おんがく','さんすう','こくご'],3:['さんすう','たいいく','こくご','しょしゃ','せいかつ'],4:['さんすう','こくご','どうとく','せいかつ','たいいく'],5:['こくご','さんすう','おんがく','こくご','がっかつ']};
const mornings={1:'あさどくしょ・よみきかせ',2:'あさせいそう',3:'ちょうかい',4:'あさせいそう',5:'あさせいそう'};
const fresh=()=>Object.fromEntries([1,2,3,4,5].map(d=>{let lessons=subjects[d],a=[['08:00','08:25','じゅんびちゅう','あさのじゅんび'],['08:25','08:40',mornings[d],'あさのかつどう'],['08:40','08:50','あさのかい','あさのかい']];const add=(start,end,subject,period)=>a.push([start,end,subject,period]);[['08:50','09:35'],['09:45','10:30'],['10:50','11:35'],['11:45','12:30'],['13:35','14:20']].forEach(([start,end],i)=>{if(i===2)add('10:30','10:50','ぎょうかんやすみ','やすみじかん');if(i===4){add('12:30','13:05','きゅうしょく','きゅうしょく');add('13:05','13:15','はみがき','はみがき');add('13:15','13:35','ひるやすみ','やすみじかん')}add(start,end,lessons[i],`${i+1}じかんめ`)});add('14:20','14:30','かえりのかい','かえりのかい');return [d,a.map(x=>({start:x[0],end:x[1],subject:x[2],period:x[3],note:''}))]}));
let schedule;try{schedule=JSON.parse(localStorage.getItem('classboard-schedule-v3'))||JSON.parse(localStorage.getItem('classboard-schedule-v2'))||fresh()}catch{schedule=fresh()}for(const d of [1,2,3,4,5]){if(Array.isArray(schedule[d])&&!schedule[d].some(x=>x.start==='08:00'))schedule[d].unshift({start:'08:00',end:'08:25',subject:'じゅんびちゅう',period:'あさのじゅんび',note:''})}const morningMessage='しゅくだいを だして、じゅんびを おわらせよう！';

for(const d of [1,2,3,4,5]){for(const item of (schedule[d]||[])){
 if(item.start==='08:00'&&item.end==='08:25'&&!item.note)item.note=morningMessage;
 if((item.period==='やすみじかん'||item.subject==='ぎょうかんやすみ'||item.subject==='ひるやすみ')&&!item.note)item.note=breakMessage;
}}
const palettes={
'こくご':['#d85b70','#fff0f2','📖'],'さんすう':['#2875d4','#e8f2ff','🔢'],'たいいく':['#28945e','#e5f7e9','⚽'],'おんがく':['#8755c5','#f2eaff','🎵'],'ずこう':['#df8730','#fff2df','🎨'],'せいかつ':['#289d87','#e4f7f0','🌱'],'どうとく':['#bc6b9d','#fcecf5','💗'],'しょしゃ':['#64748b','#edf2f7','🖌️'],'がっかつ':['#e5a225','#fff5d9','🤝'],
'じゅんびちゅう':['#e18a36','#fff3df','🎒'],'ぎょうかんやすみ':['#36a4a0','#e5f9f6','📚'],'ひるやすみ':['#36a4a0','#e5f9f6','📚'],'きゅうしょく':['#e49b37','#fff3df','🍚'],'はみがき':['#379cc9','#e7f7ff','🪥'],'あさのかい':['#5d9a65','#e9f6e9','☀️'],'かえりのかい':['#7185c1','#edf0ff','🏠'],'あさせいそう':['#5b9e8e','#e7f6ef','🧹'],'ちょうかい':['#7185c1','#edf0ff','🏫'],'あさどくしょ・よみきかせ':['#c17d52','#fff0e5','📚']};
function themeFor(item){let key=item?.subject||'';let t=palettes[key]||(item?.period==='やすみじかん'?palettes['ひるやすみ']:['#467bb5','#e9f3ff','✨']);document.documentElement.style.setProperty('--subject-accent',t[0]);document.documentElement.style.setProperty('--subject-soft',t[1]);$('subjectArt').textContent=t[2]}
let mode='auto' ,manualIndex=0,overrideDay=null;
const todayKey=()=>{let n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};
const overrideStorage='classboard-today-overrides-v1';
function getTodayChanges(){try{let v=JSON.parse(localStorage.getItem(overrideStorage));return v?.date===todayKey()?v.changes||{}:{}}catch{return {}}}
function setTodayChanges(changes){localStorage.setItem(overrideStorage,JSON.stringify({date:todayKey(),changes}))}
function lessonNumber(item){let m=(item?.period||'').match(/^([1-5])じかんめ$/);return m?Number(m[1]):null}
function applyToday(day,r){if(day!==new Date().getDay())return r;let changes=getTodayChanges();return r.map(x=>{let num=lessonNumber(x);return num&&changes[num]?{...x,subject:changes[num]}:x})}
const $=id=>document.getElementById(id);function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}function rows(day){return (schedule[day]||[]).slice().sort((a,b)=>minutes(a.start)-minutes(b.start))}function dayNow(){return overrideDay===null?new Date().getDay():overrideDay}function locate(day,now){let r=rows(day),i=r.findIndex(x=>now>=minutes(x.start)&&now<minutes(x.end));return {r,i}}function render(){let n=new Date(),day=dayNow(),now=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;const fmt=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'});$('date').textContent=fmt.format(n);$('clock').textContent=n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});let {r,i}=locate(day,now);if(mode==='manual'){i=Math.max(0,Math.min(manualIndex,r.length-1))}let item=i>=0?r[i]:null;let next=i>=0?r[i+1]:r.find(x=>minutes(x.start)>now);if(mode==='manual'&&!r.length)item=null;if(!item){$('period').textContent='';$('subject').textContent=next?'つぎのじかんを まとう':'きょうも おつかれさま！';$('note').textContent=next?'じゅんびを しよう':''}else{$('period').textContent=item.period||'';$('subject').textContent=item.subject||'じゆう';$('note').textContent=item.note||''}themeFor(item);$('nextSubject').textContent=next?.subject||'おしまい';$('nextTime').textContent=next?`${next.start} 〜 ${next.end}`:'';let remain=item?Math.max(0,Math.ceil(minutes(item.end)-now)):next?Math.max(0,Math.ceil(minutes(next.start)-now)):0;$('remainingLabel').textContent=item?'のこり時間':'つぎまで';$('remaining').textContent=item||next?`${remain}ぷん`:'--';let fraction=item?(now-minutes(item.start))/Math.max(1,minutes(item.end)-minutes(item.start)):0;$('fill').style.width=`${Math.max(0,Math.min(100,fraction*100))}%`;$('autoBtn').textContent=mode==='auto'?'● 自動モード':'↻ 自動に戻す';$('autoBtn').classList.toggle('active',mode==='manual')}
const subjectOptions=['こくご','さんすう','たいいく','おんがく','ずこう','せいかつ','どうとく','しょしゃ','がっかつ'];
function showToday(){let day=new Date().getDay();$('todayDate').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(new Date());$('todayEditor').replaceChildren();if(!schedule[day]?.length){$('todayEditor').textContent='きょうは授業がありません';$('saveToday').disabled=true;return}$('saveToday').disabled=false;let changes=getTodayChanges();for(const item of schedule[day]){let num=lessonNumber(item);if(!num)continue;let row=document.createElement('div');row.className='today-row'+(changes[num]?' today-changed':'');let label=document.createElement('b');label.textContent=`${num}じかんめ`;let sel=document.createElement('select');sel.dataset.period=num;for(const sub of [...new Set([item.subject,...subjectOptions])]){let opt=document.createElement('option');opt.value=sub;opt.textContent=sub;sel.append(opt)}sel.value=changes[num]||item.subject;let time=document.createElement('small');time.textContent=`${item.start}〜${item.end} ／ いつもは ${item.subject}`;row.append(label,sel,time);$('todayEditor').append(row)}}
$('todayBtn').onclick=()=>{showToday();$('todayDialog').showModal()};$('closeToday').onclick=()=>$('todayDialog').close();$('saveToday').onclick=()=>{let day=new Date().getDay(),changes={};for(const sel of $('todayEditor').querySelectorAll('select')){let num=Number(sel.dataset.period),base=schedule[day]?.find(x=>lessonNumber(x)===num);if(base&&sel.value!==base.subject)changes[num]=sel.value}setTodayChanges(changes);$('todayDialog').close();render()};$('resetToday').onclick=()=>{setTodayChanges({});showToday();render()};
function edit(){let d=Number($('daySelect').value);$('editor').innerHTML='';rows(d).forEach((r,i)=>{let div=document.createElement('div');div.className='editrow';div.innerHTML=`<div class="rowlabel">${i+1}つめ</div><div class="grid"><label>はじまり<input type="time" data-field="start" value="${esc(r.start)}"></label><label>おわり<input type="time" data-field="end" value="${esc(r.end)}"></label><label>時間の名前<input data-field="period" value="${esc(r.period)}"></label><label>教科・活動<input data-field="subject" value="${esc(r.subject)}"></label></div><div class="grid" style="grid-template-columns:1fr auto"><label>ひとこと<input data-field="note" value="${esc(r.note||'')}"></label><button data-remove="${i}">削除</button></div>`;$('editor').appendChild(div)});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{collect();schedule[d].splice(Number(b.dataset.remove),1);edit()})}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function collect(){let d=Number($('daySelect').value);schedule[d]=[...$('editor').querySelectorAll('.editrow')].map(el=>Object.fromEntries([...el.querySelectorAll('[data-field]')].map(input=>[input.dataset.field,input.value])))}for(let d=0;d<7;d++){for(let id of ['daySelect','displayDay']){let opt=document.createElement('option');opt.value=d;opt.textContent=names[d];$(id).append(opt)}}$('daySelect').value=new Date().getDay()||1;$('displayDay').value=new Date().getDay();$('daySelect').onchange=edit;$('displayDay').onchange=()=>{overrideDay=Number($('displayDay').value);mode='manual';manualIndex=0;render()};$('settingsBtn').onclick=()=>{$('settings').showModal();edit()};$('closeSettings').onclick=()=>$('settings').close();$('addRow').onclick=()=>{collect();let d=Number($('daySelect').value);(schedule[d]??=[]).push({start:'14:40',end:'15:00',period:'',subject:'あたらしい時間',note:''});edit()};$('save').onclick=()=>{collect();for(let d in schedule){for(let x of schedule[d])if(minutes(x.end)<=minutes(x.start)){alert('終了時刻は開始時刻より後にしてください');return}}localStorage.setItem('classboard-schedule-v3',JSON.stringify(schedule));$('settings').close();render()};$('reset').onclick=()=>{if(confirm('すべての曜日の時間割を初期設定に戻しますか？')){schedule=fresh();for(const d of [1,2,3,4,5])for(const item of schedule[d]){if(item.start==='08:00')item.note=morningMessage;if(item.period==='やすみじかん')item.note=breakMessage}localStorage.setItem('classboard-schedule-v3',JSON.stringify(schedule));edit();render()}};$('autoBtn').onclick=()=>{mode='auto';overrideDay=null;render()};function shift(k){let d=dayNow(),now=new Date(),{r,i}=locate(d,now.getHours()*60+now.getMinutes());if(mode==='auto')manualIndex=i>=0?i:Math.max(0,r.findIndex(x=>minutes(x.start)>now.getHours()*60+now.getMinutes()));manualIndex=Math.max(0,Math.min(r.length-1,manualIndex+k));mode='manual';render()}$('prevBtn').onclick=()=>shift(-1);$('nextBtn').onclick=()=>shift(1);$('fullBtn').onclick=async()=>{if(document.fullscreenElement){await document.exitFullscreen()}else{try{await document.documentElement.requestFullscreen()}catch{document.body.classList.toggle('fullscreen')}}};document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));render();setInterval(render,1000);
</script></body></html>
